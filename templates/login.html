{% extends "base.html" %}

{% block title %}Login - FPRMS{% endblock %}

{% block content %}
<div class="auth-container">
    <!-- Animated Background -->
    <div class="animated-background">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>
        <div class="bubble bubble-6"></div>
        <div class="floating-icon icon-1"><i class="fas fa-laptop-code"></i></div>
        <div class="floating-icon icon-2"><i class="fas fa-briefcase"></i></div>
        <div class="floating-icon icon-3"><i class="fas fa-chart-line"></i></div>
        <div class="floating-icon icon-4"><i class="fas fa-handshake"></i></div>
        <div class="floating-icon icon-5"><i class="fas fa-lightbulb"></i></div>
        <div class="floating-icon icon-6"><i class="fas fa-users"></i></div>
    </div>

    <div class="auth-card fade-in">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fas fa-briefcase"></i>
            </div>
            <h2 class="mt-3"><i class="fas fa-sign-in-alt me-2"></i>Welcome Back</h2>
            <p class="mb-0">Access Your Freelance Workspace</p>
        </div>
        <div class="auth-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group input-group-animated">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group input-group-animated">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4 btn-animated">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In
                </button>
            </form>
            <div class="text-center mt-4">
                <p class="mb-0">Don't have an account? 
                    <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold auth-link">Create one here</a>
                </p>
            </div>
        </div>
    </div>
</div>

<style>
/* Animated Background */
.animated-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
}

/* Floating Bubbles */
.bubble {
    position: absolute;
    border-radius: 50%;
    backdrop-filter: blur(10px);
    animation: float 20s infinite ease-in-out;
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
}

.bubble-1 {
    width: 100px;
    height: 100px;
    left: 10%;
    top: 20%;
    background: linear-gradient(135deg, #FF6B6B, #FFE66D);
    animation-delay: 0s;
    animation-duration: 15s;
}

.bubble-2 {
    width: 150px;
    height: 150px;
    right: 15%;
    top: 30%;
    background: linear-gradient(135deg, #4ECDC4, #44A08D);
    animation-delay: 2s;
    animation-duration: 18s;
}

.bubble-3 {
    width: 80px;
    height: 80px;
    left: 20%;
    bottom: 20%;
    background: linear-gradient(135deg, #A8EDEA, #FED6E3);
    animation-delay: 4s;
    animation-duration: 20s;
}

.bubble-4 {
    width: 120px;
    height: 120px;
    right: 25%;
    bottom: 30%;
    background: linear-gradient(135deg, #FF9A9E, #FAD0C4);
    animation-delay: 1s;
    animation-duration: 16s;
}

.bubble-5 {
    width: 90px;
    height: 90px;
    left: 50%;
    top: 10%;
    background: linear-gradient(135deg, #FBC2EB, #A6C1EE);
    animation-delay: 3s;
    animation-duration: 22s;
}

.bubble-6 {
    width: 110px;
    height: 110px;
    right: 40%;
    bottom: 15%;
    background: linear-gradient(135deg, #FA709A, #FEE140);
    animation-delay: 5s;
    animation-duration: 19s;
}

/* Floating Work Icons */
.floating-icon {
    position: absolute;
    opacity: 0.2;
    animation: float-icon 20s infinite ease-in-out;
    font-size: 3rem;
    color: white;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
}

.icon-1 {
    left: 8%;
    top: 15%;
    animation-delay: 0s;
    animation-duration: 18s;
}

.icon-2 {
    right: 12%;
    top: 25%;
    animation-delay: 2s;
    animation-duration: 22s;
}

.icon-3 {
    left: 15%;
    bottom: 20%;
    animation-delay: 4s;
    animation-duration: 20s;
}

.icon-4 {
    right: 20%;
    bottom: 25%;
    animation-delay: 1s;
    animation-duration: 19s;
}

.icon-5 {
    left: 45%;
    top: 12%;
    animation-delay: 3s;
    animation-duration: 21s;
}

.icon-6 {
    right: 35%;
    bottom: 18%;
    animation-delay: 5s;
    animation-duration: 17s;
}

@keyframes float-icon {
    0%, 100% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(1);
        opacity: 0.15;
    }
    25% {
        transform: translateY(-40px) translateX(20px) rotate(10deg) scale(1.2);
        opacity: 0.25;
    }
    50% {
        transform: translateY(-80px) translateX(-20px) rotate(-10deg) scale(1);
        opacity: 0.3;
    }
    75% {
        transform: translateY(-40px) translateX(20px) rotate(5deg) scale(1.1);
        opacity: 0.2;
    }
}

/* Animations */
@keyframes float {
    0%, 100% {
        transform: translateY(0) translateX(0) scale(1) rotate(0deg);
        opacity: 0.6;
    }
    25% {
        transform: translateY(-50px) translateX(30px) scale(1.2) rotate(90deg);
        opacity: 0.8;
    }
    50% {
        transform: translateY(-100px) translateX(-30px) scale(0.8) rotate(180deg);
        opacity: 1;
    }
    75% {
        transform: translateY(-50px) translateX(30px) scale(1.1) rotate(270deg);
        opacity: 0.8;
    }
}


/* Enhanced Auth Card */
.auth-card {
    position: relative;
    z-index: 1;
    backdrop-filter: blur(30px);
    background: rgba(255, 255, 255, 0.98);
    transform: translateY(0);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 
                0 0 100px rgba(102, 126, 234, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.5);
}

.auth-card:hover {
    transform: translateY(-15px) scale(1.02);
    box-shadow: 0 40px 100px rgba(0,0,0,0.4),
                0 0 150px rgba(255, 107, 107, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.8);
}

.auth-icon {
    width: 90px;
    height: 90px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    font-size: 2.5rem;
    animation: pulse 2s infinite;
    box-shadow: 0 10px 40px rgba(255, 255, 255, 0.3);
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
    }
    50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
    }
}

/* Input Group Animation */
.input-group-animated {
    transition: all 0.3s ease;
}

.input-group-animated:focus-within {
    transform: translateY(-2px);
}

.input-group-animated .input-group-text {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    transition: all 0.3s ease;
}

.input-group-animated:focus-within .input-group-text {
    transform: scale(1.1);
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
}

/* Button Animation */
.btn-animated {
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    background: linear-gradient(135deg, #667eea, #764ba2) !important;
    border: none !important;
}

.btn-animated::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.btn-animated:hover::before {
    width: 400px;
    height: 400px;
}

.btn-animated:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.btn-animated:active {
    transform: translateY(-2px) scale(1.02);
}

/* Link Animation */
.auth-link {
    position: relative;
    color: #667eea;
    transition: all 0.3s ease;
}

.auth-link::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    transition: width 0.3s ease;
}

.auth-link:hover::after {
    width: 100%;
}

.auth-link:hover {
    color: #764ba2;
}

/* Auth Header Enhancement */
.auth-header {
    background: linear-gradient(135deg, #667eea, #764ba2) !important;
}
</style>
{% endblock %}
